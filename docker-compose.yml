services:
  # Применяет новые SQL-миграции (migrations/*.sql) перед запуском остальных сервисов.
  # Если миграция упала, остальные контейнеры не стартуют/не пересоздаются (старые продолжают
  # работать со старой схемой), а `docker compose up` завершается с ошибкой.
  migrate:
    build: .
    command: python -m db.migrate
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python -m bot.main
    restart: always
    env_file: .env
    volumes:
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  collector:
    build: .
    command: python -m collector.main
    restart: always
    env_file: .env
    volumes:
      - logs:/app/logs
      - session:/app/session
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cinema_collector:
    build: .
    command: python -m cinema_collector.main
    restart: always
    env_file: .env
    volumes:
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  event_collector:
    build: .
    command: python -m event_collector.main
    restart: always
    env_file: .env
    volumes:
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  logs:
  session: