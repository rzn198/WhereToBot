scheduler:
  parse_interval_minutes: 480
  cleanup_interval_hours: 24
  storage_check_interval_hours: 1
  disk_check_interval_hours: 1
  push_alert_time: "09:00"

cleanup:
  event_cleanup_days: 7
  favorites_cleanup_days: 7
  no_date_cleanup_days: 14
  events_cleanup_days: 7
  events_max_future_days: 365

monitoring:
  file_id_error_threshold: 10
  file_id_error_window_seconds: 3600
  disk_free_threshold_pct: 20

feature_flags:
  show_source_button: false
  show_contact_button: true

alerts:
  enabled: true
  time: "09:00"
  message: "Сегодня у вас события из избранного:"
  send_delay_seconds: 0.04
  delete_after_hours: 23

photo:
  enabled: true
  max_size_bytes: 10485760
  rate_limit_seconds: 1
  caption_max_length: 1024
  truncate_limit: 4096

ui:
  preview_chars: 400
  menu_photo_file_id: "AgACAgIAAxkBAAEpzcJqGW98fiwpQcCwDjwWnuO9ncf-cgACnxprGwM-yEg0mA17sy6jJwEAAwIAA3MAAzsE"
  cinema_menu_photo_file_id: "AgACAgIAAxkBAAEpzcJqGW98fiwpQcCwDjwWnuO9ncf-cgACnxprGwM-yEg0mA17sy6jJwEAAwIAA3MAAzsE"

cinema_collector:
  parse_interval_hours: 6

event_collector:
  parse_interval_hours: 6
  detail_concurrency: 5

Menu text:
  "Афиша белграда. Все события в одном месте!"

channels:
  custom:
    - name: "@zarko_tusic"
      parser: "zarko_tusic"
    - name: "@runningbeg"
      parser: "running_beg"

opencode:
  base_url: "https://opencode.ai/zen/go/v1"
  models:
    - "jev-1.13"
    - "mimo-v2.6-flash-free"          # 30100 запросов/5ч — основная, самая ёмкая
    - "deepseek-v4.1-flash-free"  # 7600/5ч — фолбэк (транслитерирует имена в кириллицу)
    - "glm-5.3-flash"      # 6320/5ч — фолбэк
    - "longcat-2.0"        # 11400/5ч — фолбэк
  max_chars: 600


parsing:
  date_method: shadow
  category_method: shadow
  ai_null_date_fallback: true
  ai_empty_categories_fallback: true
  ai_trust_non_event: false      # включим позже, по логам AI_NON_EVENT
  max_chars: 2000
  max_calls_per_run: 1000
  timeout: 120
  models:
    - deepseek-v4.1-flash                 # основная
    - gpt-6-luna

