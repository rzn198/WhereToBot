scheduler:
  parse_interval_minutes: 480
  cleanup_interval_hours: 24
  storage_check_interval_hours: 1
  disk_check_interval_hours: 1
  push_alert_time: "09:00"

cleanup:
  event_cleanup_days: 7
  favorites_cleanup_days: 7
  no_date_cleanup_days: 14
  events_cleanup_days: 7
  events_max_future_days: 365

monitoring:
  file_id_error_threshold: 10
  file_id_error_window_seconds: 3600
  disk_free_threshold_pct: 20

feature_flags:
  show_source_button: false
  show_contact_button: true

alerts:
  enabled: true
  time: "09:00"
  message: "Сегодня у вас события из избранного:"
  send_delay_seconds: 0.04
  delete_after_hours: 23

photo:
  enabled: true
  max_size_bytes: 10485760
  rate_limit_seconds: 1
  caption_max_length: 1024
  truncate_limit: 4096

ui:
  preview_chars: 400
  menu_photo_file_id: "AgACAgIAAxkBAAEpzcJqGW98fiwpQcCwDjwWnuO9ncf-cgACnxprGwM-yEg0mA17sy6jJwEAAwIAA3MAAzsE"
  cinema_menu_photo_file_id: "AgACAgIAAxkBAAEpzcJqGW98fiwpQcCwDjwWnuO9ncf-cgACnxprGwM-yEg0mA17sy6jJwEAAwIAA3MAAzsE"

cinema_collector:
  parse_interval_hours: 8

event_collector:
  parse_interval_hours: 8
  detail_concurrency: 5
  categories: # AI-категоризация событий сайтов (efinityrs, biletrs, ticketsrs, gigstix, polako, ticrs, balkan-promo)
    method: ai            # source — как отдал скрейпер | shadow — AI считается, пишется EVENT_AI_CAT_DISAGREE, в БД прежнее | ai
    scope: unreliable         # unreliable — только где категорию не дал сам сайт | all — все события
    models: [gpt-5.6-luna, deepseek-v4.1-flash]    # цепочка: при отказе — следующая
    timeout: 60
    max_chars: 1200
    concurrency: 3
    max_calls_per_run: 600
  stale: # сверка будущих записей с листингом источника (сейчас только polako)
    mode: hide              # off | shadow (только лог EVENT_STALE_SHADOW, events не меняется)
    max_share: 0.3            # если «устаревших» больше этой доли — сверка пропускается
    min_listing: 100          # листинг меньше — сверка пропускается

Menu text:
  "Афиша белграда. Все события в одном месте!"

channels:
  custom:
    - name: "@zarko_tusic"
      parser: "zarko_tusic"
    - name: "@runningbeg"
      parser: "running_beg"

translation:
  method: off
  sources:                    # значения events.source; пусто = ничего не переводим
    - efinityrs
    - biletrs
    - ticketsrs
    - gigstix
    - balkan-promo
  models:                     # цепочка: при отказе отвечает СЛЕДУЮЩАЯ модель по списку
    - glm-5.3-flash
    - gpt-6-luna
    - deepseek-v4.1-flash
    - beam-free
  max_chars: 600              # длина перевода до ссылки на билеты
  input_chars: 1500           # сколько символов оригинала отправляем модели
  concurrency: 3
  only_upcoming: true         # события в прошлом не переводим
  retry_minutes: 30           # повтор, если модели были недоступны
  max_retries: 3
  run_on_start: true          # один проход при старте сервиса (накопленное)

parsing:
  date_method: ai
  category_method: ai
  ai_null_date_fallback: true
  ai_empty_categories_fallback: true
  ai_trust_non_event: true
  max_chars: 2000
  max_calls_per_run: 1000
  timeout: 120
  concurrency: 4
  seen_retention_days: 60
  models:
    - gpt-5.6-luna
    - gpt-6-luna
    - beam-free
    - deepseek-v4.1-flash
    - glm-5.3-flash
    - mimo-v2.6-flash
    - minimax-m3.1-flash

deduplication:
  audit:
    enabled: true          # false — журнал не пишется вообще
    max_text_chars: 4000
    rotation_mb: 50
    retention_days: 90
    raw_answers: true
    history_days: 60
  method: ai
  ai:
    models: [deepseek-v4.1-flash, gpt-6-luna, gpt-5.6-luna, beam-free, mimo-v2.6-flash, minimax-m3.1-flash]
    priority:
      - event:efinityrs
      - event:biletrs
      - event:ticketsrs
      - event:gigstix
      - event:ticrs
      - event:balkan-promo
