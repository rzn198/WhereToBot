      - ch:1798491824   # @ikonamitakikonami
      - ch:1781465418   # @turizamSerbia
      - ch:1766338407   # @wheretogobeograd


        # Где записи ОДНОГО источника можно сравнивать между собой (повтор анонса, розыгрыш билетов, две карточки).
        # channels — все Telegram-каналы; event:polako — карточки polako. Остальные сайты (ticketsrs, ticrs, ...) — запрет.
        # Ключ можно не добавлять: значения по умолчанию такие же.
    same_source:
      - channels
      - event:polako

        # Пост-перечень (дайджест, афиша недели): не побеждает и не скрывается. Слова — регулярные выражения без учёта регистра.
        # Ключ можно не добавлять: значения по умолчанию такие же.
    list_markers:
      strong_window: 80          # сильное слово в первых N символах — перечень сразу
      weak_window: 200           # слабое слово в первых N символах ...
      weak_min_times: 8          # ... И не меньше N времён/дат вида 20:00 или 12.11 во всём тексте
      strong:
        - 'дайджест'
        - 'афиша\s+(?:мероприятий|недели|на\s+неделю|выходных)'
      weak:
        - 'подборк'
        - 'на\s+выходные\s+и\s+на\s+следующую'
        - 'куда\s+пойти'
        - 'анонсы?\s+(?:на\s+)?недел'

card_lines:
  method: on                  # off | shadow | on
  auto: true          # сервис сам ничего не считает, только твой скрипт
  models:
    - deepseek-v4.1-flash
    - hy4-flash-free
    - beam-free
    - mimo-v2.6-flash
    - minimax-m3.1-flash
  batch_size: 1               # записей в одном запросе (пробуем 1 / 5 / 10 скриптом)
  max_calls_per_run: 1500     # запросов за проход; остальное в следующий
  concurrency: 3
  title_max: 40
  emoji: true
  show_value: true
  hooks:
    method: on          # off | on; сначала выкатываем выключенным
    hook_max: 80
    min_description_chars: 40
    enrich:
      method: on        # off | on
      sources: [ musicbrainz, wikipedia ]
      languages: [ ru, en, sr ]
      contact: "xoxig64518@anonmart.com"   # обязательно заполнить: идёт в User-Agent
      timeout: 10
      ttl_found_days: 90
      ttl_missing_days: 14
      ttl_ambiguous_days: 30
      retry_hours: 6
      mb_min_interval: 1.1

event_reviews:                  # чистка пересмотренных админом записей
  only_resolved: true           # чистить только разобранные
  cleanup_before:               # ГГГГ-ММ-ДД: удалить пересмотры до этой даты; пусто — не чистить

donate:                         # кнопка «Поддержать» в главном меню
  enabled: false
  url: ""
  button_text: "💰 Поддержать"